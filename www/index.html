<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25262b">
<title>Stable Diffusion Client</title>
<style>
  :root {
    --bg: #25262b;
    --card: #101010;
    --card-line: #5c4a36;
    --field: #25262b;
    --field-line: #5f5242;
    --label: #c9a27a;
    --text: #e6e8ea;
    --muted: #8d8478;
    --accent: #d9742c;
    --accent-hi: #ffa55c;
    --err: #ff8a7a;
    --mono: "Fira Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 15px; line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 28px calc(env(safe-area-inset-bottom) + 16px);
    overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 22px;
    padding: 40px 28px 34px;
    margin-bottom: 18vh;
  }
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 8px;
  }
  .brand svg { width: 30px; height: 30px; flex: none; }
  h1 {
    margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 1px;
    color: var(--accent-hi);
    background: linear-gradient(90deg, #ffa55c, #ffd0a0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 28px; }

  label { display: block; color: var(--label); font-size: 15px; margin: 0 0 8px 2px; letter-spacing: .5px; }
  input {
    width: 100%; padding: 15px 16px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--field); border: 1px solid var(--field-line); border-radius: 10px;
  }
  input::placeholder { color: #6b6256; }
  input:focus { outline: 2px solid var(--accent-hi); outline-offset: 2px; border-color: var(--accent); }

  .go {
    width: 100%; margin-top: 24px; padding: 17px; font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: 1px; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  .go:active { background: #b85f22; }
  .go:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  #msg { min-height: 1.4em; margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }
  #msg.err { color: var(--err); }

  #recent { margin-top: 22px; display: none; }
  #recent label { font-size: 13px; }
  #recentList button {
    display: block; width: 100%; margin-top: 8px; padding: 11px 14px;
    font: inherit; font-size: 14px; text-align: left; color: var(--text);
    background: transparent; border: 1px solid var(--field-line); border-radius: 8px;
  }
  #recentList button:active { background: var(--field); }

  .ver { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 14px); z-index: 1; font-size: 12px; color: #4a443c; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="card">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M14 3 C15 12 18 15 27 16 C18 17 15 20 14 29 C13 20 10 17 1 16 C10 15 13 12 14 3Z" fill="#ffa55c"/>
      <path d="M25 2 C25.4 5 26.4 6 29.5 6.5 C26.4 7 25.4 8 25 11 C24.6 8 23.6 7 20.5 6.5 C23.6 6 24.6 5 25 2Z" fill="#d9742c"/>
    </svg>
    <h1>SD Client</h1>
  </div>
  <p class="sub">Enter the address of your Stable Diffusion server.</p>

  <form id="f" autocomplete="off">
    <label for="addr">Server address</label>
    <input id="addr" type="text" inputmode="url" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="192.168.1.50:7860">
    <button class="go" type="submit">Connect</button>
  </form>
  <div id="msg" role="status"></div>

  <div id="recent">
    <label>Recent</label>
    <div id="recentList"></div>
  </div>
</main>
<div class="ver">v1.0.0</div>

<script>
/* ---------- background: grid with dots travelling along the lines ---------- */
(function () {
  var cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  var CELL = 36, W = 0, H = 0, COLS = 0, ROWS = 0, dpr = 1, dots = [];
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rnd(n) { return Math.floor(Math.random() * n); }

  function spawn(d) {
    // start on a random edge, heading inward along a grid line
    var horiz = Math.random() < 0.5;
    if (horiz) {
      d.gy = rnd(ROWS + 1); d.dy = 0;
      if (Math.random() < 0.5) { d.gx = 0; d.dx = 1; } else { d.gx = COLS; d.dx = -1; }
    } else {
      d.gx = rnd(COLS + 1); d.dx = 0;
      if (Math.random() < 0.5) { d.gy = 0; d.dy = 1; } else { d.gy = ROWS; d.dy = -1; }
    }
    d.t = Math.random();
    d.speed = 40 + Math.random() * 70;           // px per second
    d.life = 0;
    return d;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    COLS = Math.ceil(W / CELL); ROWS = Math.ceil(H / CELL);
    var n = Math.max(10, Math.round((COLS * ROWS) / 28));
    dots = [];
    for (var i = 0; i < n; i++) dots.push(spawn({}));
    drawGrid();
  }

  function drawGrid() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(210,175,140,0.09)";
    ctx.beginPath();
    for (var x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
    for (var y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
    ctx.stroke();
  }

  function step(d, dt) {
    d.t += (d.speed * dt) / CELL;
    while (d.t >= 1) {
      d.t -= 1; d.gx += d.dx; d.gy += d.dy;
      if (d.gx < 0 || d.gx > COLS || d.gy < 0 || d.gy > ROWS) { spawn(d); d.t = 0; return; }
      if (Math.random() < 0.22) {                 // turn 90 degrees at an intersection
        var s = Math.random() < 0.5 ? 1 : -1, ox = d.dx;
        d.dx = d.dy * s; d.dy = ox * s;
        if (d.dx === 0 && d.dy === 0) { d.dx = 1; }
      }
    }
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min((ts - last) / 1000 || 0, 0.05); last = ts;
    drawGrid();
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i]; step(d, dt);
      var x = (d.gx + d.dx * d.t) * CELL + .5, y = (d.gy + d.dy * d.t) * CELL + .5;
      var tx = x - d.dx * 26, ty = y - d.dy * 26;
      var g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, "rgba(255,235,215,0)"); g.addColorStop(1, "rgba(255,235,215,0.55)");
      ctx.strokeStyle = g; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = "rgba(255,240,225,0.95)";
      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!still) requestAnimationFrame(frame);
})();

/* ---------- launcher logic ---------- */
(function () {
  var KEY = "sd.addr", HIST = "sd.hist";
  var addr = document.getElementById("addr");
  var msg = document.getElementById("msg");

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // "192.168.1.50:7000" -> "http://192.168.1.50:7000"
  function normalize(raw) {
    raw = (raw || "").trim();
    if (!raw) return null;
    if (!/^https?:\/\//i.test(raw)) raw = "http://" + raw;
    try { return new URL(raw).href; } catch (e) { return null; }
  }

  function remember(url) {
    set(KEY, url);
    var h = []; try { h = JSON.parse(get(HIST) || "[]"); } catch (e) {}
    h = [url].concat(h.filter(function (u) { return u !== url; })).slice(0, 4);
    set(HIST, JSON.stringify(h));
  }

  function say(text, isErr) { msg.textContent = text; msg.className = isErr ? "err" : ""; }

  function connect(raw) {
    var url = normalize(raw);
    if (!url) { say("That doesn't look like an address.", true); return; }
    say("Connecting to " + url + " …");
    remember(url);
    window.location.href = url;
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault(); connect(addr.value);
  });

  var hist = []; try { hist = JSON.parse(get(HIST) || "[]"); } catch (e) {}
  if (hist.length) {
    var list = document.getElementById("recentList");
    hist.forEach(function (u) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = u;
      b.onclick = function () { addr.value = u; connect(u); };
      list.appendChild(b);
    });
    document.getElementById("recent").style.display = "block";
  }

  var saved = get(KEY);
  if (saved) addr.value = saved;

  // Back button from Odysseus = "change the address", so only auto-connect on a fresh launch.
  var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
  var cameBack = nav && nav.type === "back_forward";
  window.addEventListener("pageshow", function (e) { if (e.persisted) say(""); });
  if (saved && !cameBack) connect(saved);
})();
</script>
</body>
</html>
